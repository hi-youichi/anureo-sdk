name: SDK validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run generate:check
      - run: bun run protocol:check
      - run: bun run --filter @anureo/host generate:check
      - run: bun run typecheck
      - run: bun run typecheck:tooling
      - if: runner.os != 'Windows'
        run: bun run test
      # Bun 1.4.2 can crash when loading code-review suites in a shared test process.
      - name: Run SDK tests on Windows
        if: runner.os == 'Windows'
        run: bun test --timeout 15000 --path-ignore-patterns '**/code-review/tests/**' packages apps
      - name: Run code-review test files in fresh Bun processes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem -LiteralPath apps/code-review/tests -Filter '*.test.ts' -File -Recurse) {
            bun test --timeout 15000 $file.FullName
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - run: bun run --filter @anureo/host test:node
      - name: Set up private Repograph directories on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $user = [System.Security.Principal.WindowsIdentity]::GetCurrent().User
          foreach ($name in @('CBM_CACHE_DIR', 'CBM_RUNTIME_DIR')) {
            $path = Join-Path $env:USERPROFILE "anureo-$name-$([guid]::NewGuid().ToString('N'))"
            New-Item -ItemType Directory -Path $path | Out-Null
            $acl = [System.Security.AccessControl.DirectorySecurity]::new()
            $acl.SetOwner($user)
            $acl.SetAccessRuleProtection($true, $false)
            $acl.AddAccessRule([System.Security.AccessControl.FileSystemAccessRule]::new($user, 'FullControl', 'ContainerInherit, ObjectInherit', 'None', 'Allow'))
            Set-Acl -LiteralPath $path -AclObject $acl
            "$name=$path" >> $env:GITHUB_ENV
          }
      # Keep first-run download logs out of the native CLI's JSON stream.
      - name: Prepare native Repograph backend
        working-directory: apps/refactor
        run: >-
          node -e "const requireFromRepograph = require('node:module').createRequire(require.resolve('@youichi/repograph'));
          const shim = requireFromRepograph.resolve('codebase-memory-mcp/bin.js');
          require('node:child_process').execFileSync(process.execPath, [shim, '--version'], { stdio: 'inherit' });"
      # The default suite skips the native repograph backend. Opt in on every matrix runner.
      - name: Verify native refactor graph exports
        env:
          REPOGRAPH_INTEGRATION: '1'
        run: bun test apps/refactor/tests/graph.integration.test.ts
