name: SDK validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run generate:check
      - run: bun run protocol:check
      - run: bun run typecheck
      - run: bun run typecheck:tooling
      - run: bun run test
      - name: Verify native refactor graph exports
        env:
          REPOGRAPH_INTEGRATION: '1'
        run: bun test apps/refactor/tests/graph.integration.test.ts
