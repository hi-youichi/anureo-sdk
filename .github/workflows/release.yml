name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: npm install --global npm@11.20.0
      - run: bun install --frozen-lockfile
      - run: bun run generate:check
      - run: bun run protocol:check
      - run: bun run --filter @anureo/host generate:check
      - run: bun run typecheck
      - run: bun run typecheck:tooling
      - run: bun run test
      - name: Pack and test release tarballs
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          source=$(mktemp -d)
          artifacts="$RUNNER_TEMP/anureo-artifacts"
          mkdir "$artifacts"
          git archive HEAD | tar -xf - -C "$source"
          for dir in "$source"/packages/* "$source"/packages/adapter/* "$source"/apps/*; do
            if [ -f "$dir/package.json" ]; then
              test "$(cd "$dir" && node -p "require('./package.json').version")" = "$version"
              (cd "$dir" && bun pm pack --destination "$artifacts" --quiet)
            fi
          done
          cd "$(mktemp -d)"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$artifacts"/*.tgz
          npx --no-install anureo-review --help
          npx --no-install anureo-refactor --help
          npx --no-install anureo --help
      - name: Publish packages in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          for name in protocol sdk conformance adapter-acp adapter-ahp adapter-claude adapter-codex adapter-hermes adapter-pi adapter-swarm host workflow code-review refactor cli; do
            published=$(npm view --prefer-online "@anureo/$name@$version" version 2>/dev/null || true)
            if [ "$published" = "$version" ]; then
              echo "Skipping @anureo/$name@$version (already published)"
            else
              npm publish "$RUNNER_TEMP/anureo-artifacts/anureo-$name-$version.tgz" --access public --provenance
            fi
          done
      - name: Verify published registry packages
        run: |
          version=$(node -p "require('./package.json').version")
          cd "$(mktemp -d)"
          npm init -y >/dev/null
          for attempt in {1..12}; do
            # Use fresh metadata after publishing. Packing and checking for existing releases
            # can cache an older packument, including a response that omits the new version.
            cache=$(mktemp -d)
            if npm install --prefer-online --cache "$cache" --no-audit --no-fund --fetch-retries=0 "@anureo/host@$version" "@anureo/cli@$version" "@anureo/code-review@$version" "@anureo/refactor@$version" "@anureo/conformance@$version"; then
              npx --no-install anureo --help
              npx --no-install anureo-review --help
              npx --no-install anureo-refactor --help
              exit 0
            fi
            sleep 15
          done
          exit 1
