name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: npm install --global npm@11.20.0
      - run: bun install --frozen-lockfile
      - run: bun run generate:check
      - run: bun run protocol:check
      - run: bun run typecheck
      - run: bun run typecheck:tooling
      - run: bun run test
      - name: Pack and test release tarballs
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
          source=$(mktemp -d)
          artifacts="$RUNNER_TEMP/anureo-artifacts"
          mkdir "$artifacts"
          git archive HEAD | tar -xf - -C "$source"
          for dir in "$source"/packages/* "$source"/packages/adapter/* "$source"/apps/*; do
            if [ -f "$dir/package.json" ]; then
              test "$(cd "$dir" && node -p "require('./package.json').version")" = "$version"
              (cd "$dir" && bun pm pack --destination "$artifacts" --quiet)
            fi
          done
          cd "$(mktemp -d)"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$artifacts"/*.tgz
          npx --no-install anureo-review --help
          npx --no-install anureo-refactor --help
      - name: Publish packages in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          for name in protocol sdk conformance adapter-acp adapter-ahp adapter-claude adapter-codex adapter-hermes adapter-pi workflow code-review refactor; do
            published=$(npm view "@anureo/$name@$version" version 2>/dev/null || true)
            if [ "$published" = "$version" ]; then
              echo "Skipping @anureo/$name@$version (already published)"
            else
              npm publish "$RUNNER_TEMP/anureo-artifacts/anureo-$name-$version.tgz" --access public --provenance
            fi
          done
